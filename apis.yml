description: Computershare is a global financial administration company providing transfer agency and share registry services, employee equity
  plans (EquatePlus), proxy solicitation (Georgeson), entity compliance (GEMS), corporate trust, stakeholder communications and other diversified
  financial and governance services. Its public web presence documents EquateAPI, a partner API exposed by EquatePlus that supports real-time
  loads of participant data from HR systems as an alternative to SFTP file exchange; no public developer portal or API reference was found.

